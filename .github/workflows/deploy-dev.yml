name: Deploy dev

on: 
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/deploy-dev.yml"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: eu-north-1   
  S3_BUCKET_NAME: lckd-password-dev

jobs:
  fe-dev:
    name: Deploy Frontend to Dev S3 Bucket
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Sync to S3 (dev)
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete --follow-symlinks
        env:
          AWS_S3_BUCKET: ${{ env.S3_BUCKET_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
          SOURCE_DIR: './frontend/dist'

  be-dev:
    name: BE docker build & push (dev)
    runs-on: ubuntu-latest
    needs: fe-dev
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4 

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Build image
        run: |
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/lckd-password-backend"
          TAG="dev-${{ github.sha }}"
          docker build -t $IMAGE:$TAG .
      
      - name: Push image to Docker Hub
        run: |
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/lckd-password-backend"
          TAG="dev-${{ github.sha }}"
          docker push $IMAGE:$TAG
